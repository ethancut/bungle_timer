<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./stylesheet.css" />
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  <title>Timer Manager</title>
</head>

<body>
  <h1 style="text-align: center">Timer Manager</h1>
  <div class="main-content">

    <div class="container">
      <div class="grid-item">
        <label for="bits">Seconds per 100 bits</label>
        <input id="bits" placeholder="time in seconds" type="number"
          oninput="this.value = this.value.replace(/[^0-9]/g, '') " />
      </div>
      <div class="grid-item">
        <label for="subs">Seconds per sub</label>
        <input id="subs" placeholder="time in seconds" type="number"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
      </div>
      <div class="grid-item">
        <label for="donations">Seconds per $1 (donation)</label>
        <input id="donations" placeholder="time in seconds" type="number"
          oninput="this.value = this.value.replace(/[^0-9]/g, '')" />

      </div>
    </div>
    <label for="se-token">StreamElements Token</label>
    <input type="password" style="width: 200px; text-align: center; margin-top: 3px; " id="se-token"
      placeholder="Paste StreamElements JWT token" />
    <p class="hint">
      <a href="https://streamelements.com/dashboard" target="_blank">Dashboard</a> → click your avatar (top right) →
      select your channel → copy the JWT token.
    </p>
    <button id="submit-config" class="button-4">Save</button>
    <div id="submit-status"></div>
    <div style="height: 1px; background-color: rgba(204, 204, 204, 0.35); width: 100%; margin: 10px 0px;"></div>
    <div style="display: flex; flex-direction: column;">
      <h4 style="text-align: center;">Overlay Style</h4>
      <span>
        <input type="radio" id="start_plus_dur" name="overlay-format" value="start_plus_dur" checked>
        <label for="start_plus_dur">Starting + Extra (HH:MM + HH:MM:SS)</label><br>
      </span>
      <span>
        <input type="radio" id="dur" name="overlay-format" value="dur">
        <label for="dur">HH:MM:SS</label><br>
      </span>

      <span id="start-duration-wrap"
        style="display: inline-block; text-align: center; margin-top: 10px; font-size: 0.8rem;">Starting
        Duration:
        <input type="text" id="start-duration" placeholder="HH:MM" title="" style="font-size: 0.8rem;" />
      </span>
    </div>
    <button id="pause-timer" class="button-4">Start Timer</button>
  </div>
  <div class="server-status">
    <h4>Add Time Manually</h4>
    <span>
      <input type="text" placeholder="Enter time (seconds)" id="time-box" type="number"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
      <select id="add-type">
        <option value="seconds">x seconds</option>
        <option value="minutes">x minutes</option>
        <option value="bits">x hundred bits</option>
        <option value="subs">x subs</option>
        <option value="donations">$x donation</option>
      </select>
    </span>
    <button id="add-time" class="button-4">Add Time</button>
  </div>
  <span class="footer">
    Backend Status:
    <span id="status" style="margin-left: 0px">Disconnected</span>
  </span>
  <script src="./settings.js"></script>
</body>

</html>
